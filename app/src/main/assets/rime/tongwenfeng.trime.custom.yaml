# SKY.无极: approved V6 appearance; public-release voice help; keyboard fixes 2026-10-12.
patch:
  preset_keyboards/default/keys/@33/long_click: VOICE_ASSIST
  preset_keyboards/default/keys/@33/label_symbol: 
  preset_keyboards/default/keys/@33/swipe_down: Mode_switch
  preset_keyboards/letter/keys/@33/long_click: VOICE_ASSIST
  preset_keyboards/letter/keys/@33/label_symbol: 
  tool_bar/buttons:
  - foreground:
      style: ic@keyboard_close
      normal: candidate_text_color
    action: Hide
  - foreground:
      style: ic@emoticon
    action: liquid_keyboard_emoji
  - foreground:
      style: ic@clipboard
    action: clipboard_window
  - foreground:
      style: ic@cursor_text
    action: Keyboard_editor
  - foreground:
      option_styles:
      - 中
      - En
      font_size: 18
      padding: 10
    action: Mode_switch
  - foreground:
      option_styles:
      - ic@moon_full
      - ic@moon_new
    action: Zenkaku_Hankaku
  - foreground:
      style: 
      font_size: 22
      padding: 8
      normal: candidate_text_color
    action: VOICE_ASSIST
  preset_keys/BackSpace/label: ic@backspace_outline
  preset_keys/BackSpace/preview: ic@backspace_outline
  preset_keys/BackSpace2/label: ic@backspace_outline
  preset_keys/BackSpace2/preview: ic@backspace_outline
  style/key_border: 1
  preset_color_schemes/so_young/key_border_color: '0xffc9c1c1'
  preset_color_schemes/so_young/off_key_border_color: '0xff922835'
  preset_color_schemes/so_young/hilited_key_border_color: '0xffb63341'
  preset_keys/Return/label: ic@keyboard_return
  preset_keys/Return/preview: ic@keyboard_return
  preset_keys/Return1/label: ic@keyboard_return
  preset_keys/Return1/preview: ic@keyboard_return
  preset_keys/select_all/label: ☑
  preset_keys/select_all/preview: ☑
  preset_keys/cut/label: ✁
  preset_keys/cut/preview: ✁
  preset_keys/copy/label: ❐
  preset_keys/copy/preview: ❐
  preset_keys/paste/label: ▣
  preset_keys/paste/preview: ▣
  preset_keys/paste_clip/label: ▣
  preset_keys/paste_clip/preview: ▣
  preset_keys/VOICE_ASSIST/label: 
  preset_keys/VOICE_ASSIST/preview: 
  preset_keys/clipboard_window/label: ic@clipboard_text_outline
  preset_keys/clipboard_window/preview: ic@clipboard_text_outline
  preset_keyboards/default/keys/@31:
